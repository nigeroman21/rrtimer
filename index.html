<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таймер хода</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f5f5f5;font-family:Arial,sans-serif}
h1{text-align:center}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
select,button{padding:12px 16px;font-size:16px}
#players{display:grid;gap:20px}
.player{min-height:180px;border:4px solid #000;border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer}
.player.active{outline:10px solid red;outline-offset:4px}
.player1{background:#ff9ecb}
.player2{background:#ffe76a}
.player3{background:#8ee78e}
.player4{background:#8fc8ff}
.name{font-size:28px;font-weight:bold}
.time{font-size:64px;font-weight:bold}
.status{font-size:18px;margin-top:10px}
@media(min-width:900px){
#players.two,#players.three,#players.four{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<h1>Таймер хода</h1>

<div class="controls">
<select id="playerCount">
<option value="2">2 игрока</option>
<option value="3">3 игрока</option>
<option value="4">4 игрока</option>
</select>

<select id="timeSelect">
<option value="60">1 минута</option>
<option value="300">5 минут</option>
<option value="600">10 минут</option>
</select>

<button onclick="startTimer()">Старт</button>
<button onclick="pauseTimer()">Пауза</button>
<button onclick="resetGame()">Сброс</button>
</div>

<div id="players"></div>

<script>
let playerCount = 2;
let turnTime = 60;
let timeLeft = 60;
let currentPlayer = 0;
let running = false;
let timer = null;

function formatTime(seconds){
 const m=Math.floor(seconds/60);
 const s=seconds%60;
 return `${m}:${String(s).padStart(2,"0")}`;
}

function buildPlayers(){
 const container=document.getElementById("players");
 container.innerHTML="";
 container.className=playerCount===2?"two":playerCount===3?"three":"four";

 for(let i=0;i<playerCount;i++){
   const card=document.createElement("div");
   card.className=`player player${i+1}`;
   card.id=`player-${i}`;
   card.onclick=()=>passTurn(i);
   card.innerHTML=`
     <div class="name">Игрок ${i+1}</div>
     <div class="time">ОЖИДАНИЕ</div>
     <div class="status"></div>`;
   container.appendChild(card);
 }
 updateUI();
}

function updateUI(){
 for(let i=0;i<playerCount;i++){
   const card=document.getElementById(`player-${i}`);
   if(!card) continue;

   const time=card.querySelector(".time");
   const status=card.querySelector(".status");

   card.classList.remove("active");

   if(i===currentPlayer){
      card.classList.add("active");
      time.textContent=formatTime(timeLeft);
      status.textContent=running?"ВАШ ХОД":"ГОТОВ";
   } else {
      time.textContent="ОЖИДАНИЕ";
      status.textContent="";
   }
 }
}

function nextPlayer(){
 currentPlayer=(currentPlayer+1)%playerCount;
 timeLeft=turnTime;
 updateUI();
}

function passTurn(clickedPlayer){
 if(!running) return;
 if(clickedPlayer!==currentPlayer) return;
 nextPlayer();
}

function tick(){
 if(!running) return;
 timeLeft--;
 if(timeLeft<=0){
   nextPlayer();
 } else {
   updateUI();
 }
}

function startTimer(){
 if(running) return;
 running=true;
 clearInterval(timer);
 timer=setInterval(tick,1000);
 updateUI();
}

function pauseTimer(){
 running=false;
 clearInterval(timer);
 timer=null;
 updateUI();
}

function resetGame(){
 clearInterval(timer);
 timer=null;
 running=false;

 playerCount=Number(document.getElementById("playerCount").value);
 turnTime=Number(document.getElementById("timeSelect").value);
 timeLeft=turnTime;
 currentPlayer=0;

 buildPlayers();
}
resetGame();
</script>

</body>
</html>
